{% extends 'base.html' %}

{% block title %} Editar Tarea {% endblock %}

{% block content %}
    <h1> Editar Tarea {{ tarea.nombre }} </h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p}}
        <button type="submit"> Guardar Cambios </button>
    </form>
    <a href="{% url 'listar_tareas' proyecto_id=proyecto.id %}"> Volver a la lista de tareas </a>
{% endblock %}
