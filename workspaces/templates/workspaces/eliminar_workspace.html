{% extends 'base.html' %}

{% block title%} Eliminar Categoria {% endblock %}

{% block content%}
    <h1> Eliminar Workspace {{ workspace.name }} </h1>

    <form  method="POST">
        {% csrf_token %}
        <p>¿Está seguro de que desea eliminar este workspace?</p>
        <button type="submit"> Eliminar </button>
    </form>
    <a href="{% url 'listar_workspaces' %}"> Cancelar </a>

{% endblock %}
